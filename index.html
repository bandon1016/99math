<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>99乘法表大冒險 - 歡樂遊樂園</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap');
        
        * {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 旋轉摩天輪背景動畫 */
        @keyframes rotateFerris {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .ferris-wheel-spin {
            animation: rotateFerris 40s linear infinite;
        }
        
        @keyframes floatCloud {
            0% { transform: translateX(-10%); }
            50% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }
        .cloud-anim {
            animation: floatCloud 12s ease-in-out infinite;
        }

        @keyframes bouncePet {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.05); }
        }
        .bounce-pet {
            animation: bouncePet 2s ease-in-out infinite;
        }

        .btn-press {
            transition: all 0.08s ease;
        }
        .btn-press:active {
            transform: translateY(4px) scale(0.95);
            box-shadow: 0 1px 0 #b58a00 !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #f59e0b;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-sky-200 min-h-screen overflow-x-hidden overflow-y-auto flex flex-col justify-between relative text-slate-800">

    <!-- 背景動態遊樂園元素 -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100"></div>
        
        <div class="absolute top-3 left-5 text-white/80 text-6xl cloud-anim"><i class="fa-solid fa-cloud"></i></div>
        <div class="absolute top-10 right-16 text-white/70 text-8xl cloud-anim" style="animation-delay: -4s;"><i class="fa-solid fa-cloud"></i></div>
        
        <!-- 摩天輪 (輪廓結構) -->
        <div class="absolute -bottom-10 -right-10 md:right-5 w-72 h-72 md:w-96 md:h-96 opacity-30 md:opacity-40">
            <div class="w-full h-full relative ferris-wheel-spin">
                <div class="absolute inset-0 border-8 border-dashed border-pink-500 rounded-full"></div>
                <div class="absolute inset-4 border-4 border-amber-400 rounded-full"></div>
                <div class="absolute top-1/2 left-0 right-0 h-1 bg-pink-400"></div>
                <div class="absolute top-0 bottom-0 left-1/2 w-1 bg-pink-400"></div>
                <div class="absolute top-1/2 left-2 text-pink-600 text-xl"><i class="fa-solid fa-circle"></i></div>
                <div class="absolute top-1/2 right-2 text-yellow-500 text-xl"><i class="fa-solid fa-circle"></i></div>
                <div class="absolute top-2 left-1/2 text-cyan-500 text-xl"><i class="fa-solid fa-circle"></i></div>
                <div class="absolute bottom-2 left-1/2 text-purple-500 text-xl"><i class="fa-solid fa-circle"></i></div>
            </div>
            <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[40px] border-l-transparent border-r-[40px] border-r-transparent border-b-[80px] border-b-pink-400/50"></div>
        </div>

        <div class="absolute bottom-0 left-2 opacity-20 text-red-400 text-9xl">
            <i class="fa-solid fa-campground"></i>
        </div>
    </div>

    <!-- 頂部導覽區 -->
    <header class="relative z-10 w-full max-w-6xl mx-auto px-3 pt-2 pb-1 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="bg-amber-400 text-amber-900 font-black px-3 py-1 rounded-full text-sm md:text-lg shadow-md flex items-center gap-1">
                <i class="fa-solid fa-ferris-wheel text-pink-600"></i> 99乘法遊樂園
            </span>
        </div>

        <div class="flex gap-2">
            <button id="bgmBtn" onclick="toggleBGM()" class="bg-pink-500 hover:bg-pink-600 active:scale-95 text-white font-bold text-xs md:text-sm px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5 transition">
                <i id="bgmIcon" class="fa-solid fa-music"></i> <span id="bgmText">音樂: 開</span>
            </button>
            <button onclick="openSelectModal()" class="bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold text-xs md:text-sm px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5 transition">
                <i class="fa-solid fa-sliders"></i> 選擇乘法表
            </button>
            <button onclick="openDiaryModal()" class="bg-purple-500 hover:bg-purple-600 active:scale-95 text-white font-bold text-xs md:text-sm px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5 transition">
                <i class="fa-solid fa-book-open"></i> 挑戰日記
            </button>
        </div>
    </header>

    <!-- 主要遊戲區域 -->
    <main class="relative z-10 w-full max-w-5xl mx-auto px-2 py-1 flex-1 flex flex-col justify-center items-center">
        <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-3 md:p-5 shadow-2xl border-4 border-amber-300 flex flex-col md:flex-row gap-3 md:gap-6 items-stretch my-auto">
            
            <!-- 左側：題目區 -->
            <div class="flex-1 bg-gradient-to-br from-amber-50 to-orange-100 rounded-2xl p-3 md:p-5 border-2 border-amber-200 flex flex-col justify-between items-center relative overflow-hidden shadow-inner">
                <div class="w-full flex justify-between items-center mb-1">
                    <span id="levelTag" class="bg-orange-500 text-white font-bold text-xs px-2.5 py-0.5 rounded-md shadow">隨機挑戰中</span>
                    <div class="flex items-center gap-2 text-xs md:text-sm font-bold">
                        <span class="text-emerald-600"><i class="fa-solid fa-circle-check"></i> <span id="scoreRight">0</span></span>
                        <span class="text-rose-500"><i class="fa-solid fa-circle-xmark"></i> <span id="scoreWrong">0</span></span>
                    </div>
                </div>

                <div class="flex items-center gap-2 my-1 md:my-2 w-full justify-center">
                    <div class="text-4xl md:text-6xl text-amber-500 bounce-pet drop-shadow">
                        🐻
                    </div>
                    <div class="bg-white px-3 py-1.5 rounded-2xl border-2 border-amber-300 shadow text-slate-700 font-bold text-xs md:text-sm relative">
                        <span id="petSpeech">算算看這題是多少吧！</span>
                    </div>
                </div>

                <div class="bg-white/95 rounded-2xl p-3 md:p-4 w-full text-center border-4 border-amber-400 shadow-lg my-1">
                    <div class="text-xs text-amber-600 font-bold mb-0.5">題目 (請填寫答案)</div>
                    <div class="text-4xl md:text-6xl font-black text-amber-600 tracking-wider flex items-center justify-center gap-2">
                        <span id="numA">3</span>
                        <span class="text-pink-500">×</span>
                        <span id="numB">6</span>
                        <span class="text-slate-400">=</span>
                        <span id="userAnswerDisplay" class="min-w-[1.8em] text-cyan-600 underline decoration-dashed decoration-amber-400 bg-amber-50 px-2 rounded">?</span>
                    </div>
                </div>

                <div class="w-full flex justify-center mt-2">
                    <button onclick="speakCurrentQuestion()" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 font-bold text-xs px-4 py-1.5 rounded-full shadow flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-volume-high"></i> 讀題 (承以)
                    </button>
                </div>
            </div>

            <!-- 右側：九宮格鍵盤 -->
            <div class="flex-1 flex flex-col justify-between gap-2">
                <div class="grid grid-cols-3 gap-2 flex-1">
                    <button onclick="pressNum(1)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">1</button>
                    <button onclick="pressNum(2)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">2</button>
                    <button onclick="pressNum(3)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">3</button>
                    
                    <button onclick="pressNum(4)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">4</button>
                    <button onclick="pressNum(5)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">5</button>
                    <button onclick="pressNum(6)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">6</button>
                    
                    <button onclick="pressNum(7)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">7</button>
                    <button onclick="pressNum(8)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">8</button>
                    <button onclick="pressNum(9)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 md:py-3 border-2 border-amber-200">9</button>

                    <button onclick="clearAnswer()" class="btn-press bg-slate-300 hover:bg-slate-200 text-slate-700 font-bold text-lg md:text-xl rounded-2xl shadow-[0_4px_0_#94a3b8] py-2 border-2 border-slate-100"><i class="fa-solid fa-delete-left"></i> 清除</button>
                    <button onclick="pressNum(0)" class="btn-press bg-amber-400 hover:bg-amber-300 text-amber-950 font-black text-2xl md:text-3xl rounded-2xl shadow-[0_4px_0_#d97706] py-2 border-2 border-amber-200">0</button>
                    <button onclick="submitAnswer()" class="btn-press bg-emerald-500 hover:bg-emerald-400 text-white font-black text-lg md:text-xl rounded-2xl shadow-[0_4px_0_#059669] py-2 border-2 border-emerald-300 flex items-center justify-center gap-1"><i class="fa-solid fa-paper-plane"></i> 送出</button>
                </div>
            </div>
        </div>
    </main>

    <!-- 關卡選擇 Modal -->
    <div id="selectModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-md w-full border-4 border-sky-300 shadow-2xl relative">
            <h3 class="text-xl font-black text-sky-600 mb-3 text-center flex items-center justify-center gap-2">
                <i class="fa-solid fa-list-check"></i> 選擇要練習的乘法表
            </h3>
            <div class="grid grid-cols-4 gap-2 mb-5">
                <script>
                    for(let i=2; i<=9; i++){
                        document.write(`
                            <label class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-sky-100 bg-sky-50 cursor-pointer hover:bg-sky-100 transition">
                                <input type="checkbox" value="${i}" class="num-checkbox w-5 h-5 accent-sky-500 mb-1" checked>
                                <span class="font-black text-sky-800 text-base">${i} 段</span>
                            </label>
                        `);
                    }
                </script>
            </div>
            <div class="flex gap-2">
                <button onclick="selectAll(true)" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-xl font-bold text-xs">全選</button>
                <button onclick="selectAll(false)" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-xl font-bold text-xs">全取消</button>
            </div>
            <div class="mt-4">
                <button onclick="saveSelection()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-2.5 rounded-xl shadow-md text-sm">
                    確認關卡並開始！
                </button>
            </div>
        </div>
    </div>

    <!-- 挑戰日記 Modal -->
    <div id="diaryModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-lg w-full border-4 border-purple-300 shadow-2xl relative max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xl font-black text-purple-600 flex items-center gap-2">
                    <i class="fa-solid fa-book-bookmark"></i> 每日學習挑戰日記
                </h3>
                <button onclick="closeDiaryModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold px-2">&times;</button>
            </div>
            <div class="grid grid-cols-3 gap-2 mb-3 bg-purple-50 p-3 rounded-2xl border border-purple-100 text-center">
                <div>
                    <div class="text-xs text-purple-600 font-bold">總挑戰次數</div>
                    <div id="statTotal" class="text-xl font-black text-purple-800">0</div>
                </div>
                <div>
                    <div class="text-xs text-purple-600 font-bold">平均正確率</div>
                    <div id="statAccuracy" class="text-xl font-black text-emerald-600">0%</div>
                </div>
                <div>
                    <div class="text-xs text-purple-600 font-bold">最常錯魔王題</div>
                    <div id="statHardest" class="text-lg font-black text-rose-500">無</div>
                </div>
            </div>
            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="diaryList"></div>
            <div class="mt-4 flex justify-between items-center pt-2 border-t border-slate-100">
                <button onclick="clearDiaryData()" class="text-xs text-rose-500 hover:underline"><i class="fa-solid fa-trash-can"></i> 清除紀錄</button>
                <button onclick="closeDiaryModal()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-5 py-2 rounded-xl text-xs shadow">關閉</button>
            </div>
        </div>
    </div>

    <script>
        let selectedTables = [2, 3, 4, 5, 6, 7, 8, 9];
        let currentA = 3, currentB = 6, userAnswer = "";
        let scoreRightCount = 0, scoreWrongCount = 0;
        
        const synth = window.speechSynthesis;
        let audioCtx = null, isBgmPlaying = true, bgmTimer = null, currentStep = 0;

        const melodyNotes = [
            523.25, 659.25, 783.99, 1046.50,
            880.00, 659.25, 783.99, 659.25,
            587.33, 698.46, 880.00, 987.77,
            783.99, 659.25, 523.25, 659.25
        ];

        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBgmStep() {
            if (!isBgmPlaying || !audioCtx) return;
            const freq = melodyNotes[currentStep % melodyNotes.length];
            currentStep++;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.45);
        }

        function startBGM() {
            initAudioContext();
            if (bgmTimer) clearInterval(bgmTimer);
            bgmTimer = setInterval(playBgmStep, 250);
        }

        function toggleBGM() {
            isBgmPlaying = !isBgmPlaying;
            const bgmBtn = document.getElementById("bgmBtn");
            const bgmText = document.getElementById("bgmText");
            if (isBgmPlaying) {
                bgmBtn.className = "bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs md:text-sm px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5";
                bgmText.innerText = "音樂: 開";
                startBGM();
            } else {
                bgmBtn.className = "bg-slate-400 hover:bg-slate-500 text-white font-bold text-xs md:text-sm px-3 py-1.5 rounded-full shadow-md flex items-center gap-1.5";
                bgmText.innerText = "音樂: 關";
                if (bgmTimer) clearInterval(bgmTimer);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            generateNextQuestion();
            updateLevelTag();
            document.body.addEventListener('pointerdown', () => {
                initAudioContext();
                if (isBgmPlaying && !bgmTimer) startBGM();
            }, { once: true });
        });

        function speakNumber(num) {
            initAudioContext();
            if ('speechSynthesis' in window) {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(num.toString());
                u.lang = 'zh-TW';
                u.rate = 1.1;
                synth.speak(u);
            }
        }

        function speakCurrentQuestion() {
            initAudioContext();
            if ('speechSynthesis' in window) {
                synth.cancel();
                const u = new SpeechSynthesisUtterance(`${currentA} 承以 ${currentB} 等於多少？`);
                u.lang = 'zh-TW';
                u.rate = 1.0;
                synth.speak(u);
            }
        }

        function pressNum(digit) {
            speakNumber(digit);
            if (userAnswer.length < 2) {
                userAnswer += digit.toString();
                updateDisplay();
            }
        }

        function clearAnswer() {
            userAnswer = "";
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById("userAnswerDisplay").innerText = userAnswer === "" ? "?" : userAnswer;
        }

        function generateNextQuestion() {
            if (selectedTables.length === 0) selectedTables = [2, 3, 4, 5, 6, 7, 8, 9];
            currentA = selectedTables[Math.floor(Math.random() * selectedTables.length)];
            currentB = Math.floor(Math.random() * 9) + 1;

            document.getElementById("numA").innerText = currentA;
            document.getElementById("numB").innerText = currentB;

            userAnswer = "";
            updateDisplay();
            speakCurrentQuestion();
        }

        function submitAnswer() {
            if (userAnswer === "") return;
            const correctVal = currentA * currentB;
            const userVal = parseInt(userAnswer);

            if (userVal === correctVal) {
                scoreRightCount++;
                document.getElementById("scoreRight").innerText = scoreRightCount;
                document.getElementById("petSpeech").innerText = "太棒了！答對囉！🎉";
                recordAttempt(currentA, currentB, true);
                setTimeout(generateNextQuestion, 1000);
            } else {
                scoreWrongCount++;
                document.getElementById("scoreWrong").innerText = scoreWrongCount;
                document.getElementById("petSpeech").innerText = `差一點點！${currentA}×${currentB}=${correctVal} 喔！💪`;
                recordAttempt(currentA, currentB, false);
                clearAnswer();
            }
        }

        function recordAttempt(a, b, isCorrect) {
            const today = new Date().toISOString().split('T')[0];
            let history = JSON.parse(localStorage.getItem('math_game_diary') || '{}');
            if (!history[today]) {
                history[today] = { total: 0, correct: 0, wrong: 0, tablesUsed: [], wrongQuestions: {} };
            }
            const dayRecord = history[today];
            dayRecord.total += 1;
            if (!dayRecord.tablesUsed.includes(a)) dayRecord.tablesUsed.push(a);

            if (isCorrect) {
                dayRecord.correct += 1;
            } else {
                dayRecord.wrong += 1;
                const qKey = `${a}×${b}`;
                dayRecord.wrongQuestions[qKey] = (dayRecord.wrongQuestions[qKey] || 0) + 1;
            }
            localStorage.setItem('math_game_diary', JSON.stringify(history));
        }

        function openSelectModal() { document.getElementById("selectModal").classList.remove("hidden"); }
        function selectAll(checked) { document.querySelectorAll('.num-checkbox').forEach(cb => cb.checked = checked); }
        function saveSelection() {
            const checkboxes = document.querySelectorAll('.num-checkbox:checked');
            selectedTables = Array.from(checkboxes).map(cb => parseInt(cb.value));
            if (selectedTables.length === 0) return alert("請至少選擇一個段數喔！");
            document.getElementById("selectModal").classList.add("hidden");
            updateLevelTag();
            generateNextQuestion();
        }

        function updateLevelTag() {
            document.getElementById("levelTag").innerText = selectedTables.length === 8 ? "全範圍 (2~9段)" : `練習中: ${selectedTables.join(', ')} 段`;
        }

        function openDiaryModal() { renderDiaryData(); document.getElementById("diaryModal").classList.remove("hidden"); }
        function closeDiaryModal() { document.getElementById("diaryModal").classList.add("hidden"); }

        function renderDiaryData() {
            const history = JSON.parse(localStorage.getItem('math_game_diary') || '{}');
            const dates = Object.keys(history).sort().reverse();
            let grandTotal = 0, grandCorrect = 0, allWrongStats = {};
            const listContainer = document.getElementById("diaryList");
            listContainer.innerHTML = "";

            if (dates.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-400 py-6 text-sm">還沒有挑戰紀錄喔！</div>`;
                return;
            }

            dates.forEach(date => {
                const rec = history[date];
                grandTotal += rec.total;
                grandCorrect += rec.correct;
                const acc = rec.total > 0 ? Math.round((rec.correct / rec.total) * 100) : 0;

                if (rec.wrongQuestions) {
                    Object.entries(rec.wrongQuestions).forEach(([q, count]) => {
                        allWrongStats[q] = (allWrongStats[q] || 0) + count;
                    });
                }

                listContainer.innerHTML += `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-slate-700 text-xs">${date}</span>
                            <span class="text-xs font-black px-2 py-0.5 rounded ${acc >= 80 ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">正確率 ${acc}%</span>
                        </div>
                        <div class="text-xs text-slate-500 flex justify-between">
                            <span>挑戰段數: ${rec.tablesUsed ? rec.tablesUsed.join(', ') : ''} 段</span>
                            <span>答對 ${rec.correct} / 總題 ${rec.total}</span>
                        </div>
                    </div>
                `;
            });

            document.getElementById("statTotal").innerText = grandTotal;
            document.getElementById("statAccuracy").innerText = grandTotal > 0 ? `${Math.round((grandCorrect / grandTotal) * 100)}%` : "0%";

            let hardest = "無", maxW = 0;
            Object.entries(allWrongStats).forEach(([q, count]) => {
                if (count > maxW) { maxW = count; hardest = q; }
            });
            document.getElementById("statHardest").innerText = hardest;
        }

        function clearDiaryData() {
            if (confirm("確定要清除所有挑戰紀錄嗎？")) {
                localStorage.removeItem('math_game_diary');
                renderDiaryData();
            }
        }
    </script>
</body>
</html>
