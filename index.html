<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歡樂遊樂園 - 99乘法表大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 摩天輪旋轉動畫 */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes spin-reverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }
        .ferris-wheel-spin {
            animation: spin-slow 40s linear infinite;
            transform-origin: center center;
        }
        .gondola-counter-spin {
            animation: spin-reverse 40s linear infinite;
            transform-origin: center center;
        }

        /* 飄浮雲朵 */
        @keyframes float-cloud {
            0% { transform: translateX(-10%); }
            50% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }
        .animate-cloud {
            animation: float-cloud 15s ease-in-out infinite;
        }

        /* 浮雕立體按鈕樣式 */
        .btn-3d {
            box-shadow: 0 6px 0 rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.4);
            transition: all 0.08s ease;
        }
        .btn-3d:active {
            box-shadow: 0 2px 0 rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.4);
            transform: translateY(4px);
        }

        /* 自訂彈窗動畫 */
        @keyframes pop-in {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop-in 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-sky-300 via-sky-200 to-amber-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden overflow-y-auto select-none">

    <!-- 本地背景音樂標籤 (自動相容 bgm.mp3 檔案) -->
    <audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>

    <!-- 動態遊樂園背景圖層 (摩天輪、雲朵) -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <svg class="absolute top-4 left-10 w-32 md:w-48 text-white/80 animate-cloud" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>
        <svg class="absolute top-12 right-20 w-40 md:w-64 text-white/70 animate-cloud" style="animation-delay: -5s;" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/>
        </svg>

        <!-- 摩天輪 (右下角大背景) -->
        <div class="absolute -bottom-12 -right-12 opacity-35 md:opacity-50">
            <svg width="450" height="450" viewBox="0 0 400 400" class="w-[300px] h-[300px] md:w-[480px] md:h-[480px]">
                <polygon points="200,200 130,380 270,380" fill="#F43F5E" />
                <polygon points="200,200 150,380 250,380" fill="#FB7185" />
                <g class="ferris-wheel-spin">
                    <circle cx="200" cy="200" r="160" fill="none" stroke="#FBBF24" stroke-width="8" />
                    <circle cx="200" cy="200" r="120" fill="none" stroke="#F59E0B" stroke-width="4" />
                    <line x1="200" y1="40" x2="200" y2="360" stroke="#FBBF24" stroke-width="4" />
                    <line x1="40" y1="200" x2="360" y2="200" stroke="#FBBF24" stroke-width="4" />
                    <line x1="87" y1="87" x2="313" y2="313" stroke="#FBBF24" stroke-width="4" />
                    <line x1="87" y1="313" x2="313" y2="87" stroke="#FBBF24" stroke-width="4" />
                    
                    <g transform="translate(200, 40)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#EF4444"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(313, 87)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#3B82F6"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(360, 200)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#10B981"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(313, 313)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#EC4899"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(200, 360)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#8B5CF6"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(87, 313)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#F59E0B"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(40, 200)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#06B6D4"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                    <g transform="translate(87, 87)"><g class="gondola-counter-spin"><rect x="-15" y="0" width="30" height="26" rx="6" fill="#84CC16"/><circle cx="0" cy="-5" r="4" fill="#F59E0B"/></g></g>
                </g>
                <circle cx="200" cy="200" r="22" fill="#E11D48" />
                <circle cx="200" cy="200" r="10" fill="#FEF08A" />
            </svg>
        </div>

        <div class="absolute bottom-0 inset-x-0 h-16 md:h-24 bg-emerald-400 rounded-t-[50%] scale-x-125 z-0 opacity-80"></div>
        <div class="absolute bottom-0 inset-x-0 h-12 md:h-16 bg-emerald-500 rounded-t-[40%] scale-x-110 z-0"></div>
    </div>

    <!-- 頂部列 -->
    <header class="relative z-10 px-3 py-1.5 md:px-6 md:py-2 flex items-center justify-between bg-white/85 backdrop-blur-md border-b-2 md:border-b-4 border-yellow-400 shadow-sm shrink-0">
        <div class="flex items-center space-x-2 md:space-x-3">
            <div class="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-tr from-pink-500 to-amber-400 rounded-xl flex items-center justify-center text-white text-base md:text-2xl shadow-md transform -rotate-6">
                🎡
            </div>
            <div>
                <h1 class="text-base md:text-2xl font-black text-amber-900 tracking-wide leading-tight">乘法表遊樂園</h1>
                <p class="text-[10px] md:text-xs text-amber-700 hidden sm:block">快樂學習 9×9 數學大冒險</p>
            </div>
        </div>

        <div class="flex items-center space-x-1.5 md:space-x-2.5 text-xs md:text-base">
            <button id="bgmToggleBtn" onclick="toggleBGM()" class="btn-3d px-2.5 py-1.5 md:px-3 md:py-2 bg-purple-500 hover:bg-purple-600 text-white rounded-lg md:rounded-xl font-bold flex items-center space-x-1 border border-purple-300">
                <i id="bgmIcon" class="fas fa-music text-xs md:text-sm"></i>
                <span id="bgmText" class="hidden sm:inline">音樂: 關</span>
            </button>

            <button onclick="openVolumeModal()" class="btn-3d px-2.5 py-1.5 md:px-3 md:py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg md:rounded-xl font-bold flex items-center space-x-1 border border-indigo-300">
                <i class="fas fa-sliders-h text-xs md:text-sm"></i>
                <span>音量</span>
            </button>

            <button onclick="openDiaryModal()" class="btn-3d px-2.5 py-1.5 md:px-3.5 md:py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-lg md:rounded-xl font-bold flex items-center space-x-1 border border-amber-300">
                <i class="fas fa-book-open text-yellow-200 text-xs md:text-sm"></i>
                <span>挑戰日記</span>
            </button>

            <button onclick="showSetupScreen()" class="btn-3d px-2.5 py-1.5 md:px-3 md:py-2 bg-sky-500 hover:bg-sky-600 text-white rounded-lg md:rounded-xl font-bold flex items-center space-x-1 border border-sky-300">
                <i class="fas fa-gamepad text-xs md:text-sm"></i>
                <span class="hidden sm:inline">設定</span>
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="relative z-10 flex-1 flex items-center justify-center p-2 sm:p-4 md:p-6 max-w-6xl mx-auto w-full my-auto">

        <!-- 1. 關卡選擇畫面 (Setup Screen) -->
        <div id="setupScreen" class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-2xl md:rounded-3xl p-4 md:p-6 shadow-xl border-2 md:border-4 border-yellow-300 animate-pop my-auto">
            <div class="text-center mb-3 md:mb-5">
                <span class="px-3 py-0.5 bg-pink-100 text-pink-600 rounded-full font-bold text-xs tracking-wider">SELECT TABLE</span>
                <h2 class="text-lg md:text-2xl font-black text-gray-800 mt-1">選擇今天想挑戰的乘法表！</h2>
                <p class="text-gray-600 text-xs md:text-sm mt-0.5">可勾選多個段數進行混合隨機出題</p>
            </div>

            <!-- 段數選擇 -->
            <div class="grid grid-cols-4 gap-2 md:gap-3 mb-4 md:mb-6">
                <script>
                    for(let i=2; i<=9; i++) {
                        document.write(`
                            <label class="relative flex flex-col items-center justify-center p-2 md:p-3.5 rounded-xl border-2 md:border-4 border-amber-200 bg-amber-50 hover:bg-amber-100 cursor-pointer transition-all shadow-sm group select-none">
                                <input type="checkbox" value="${i}" class="table-checkbox hidden" checked onchange="updateSelectedTablesUI()">
                                <span class="number-badge text-xl md:text-3xl font-black text-amber-800 group-hover:scale-110 transition-transform">${i}</span>
                                <span class="text-[10px] md:text-xs font-bold text-amber-600 mt-0.5">${i} 的乘法</span>
                                <div class="check-icon absolute top-1 right-1 w-4 h-4 md:w-5 md:h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center text-[10px] opacity-100 transition-opacity">
                                    <i class="fas fa-check"></i>
                                </div>
                            </label>
                        `);
                    }
                </script>
            </div>

            <div class="flex justify-between items-center mb-4 px-1 text-xs md:text-sm">
                <div class="space-x-1.5">
                    <button onclick="selectAllTables(true)" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg transition">全選</button>
                    <button onclick="selectAllTables(false)" class="px-2.5 py-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-lg transition">清除</button>
                </div>
                <div class="font-bold text-amber-800">
                    題數：
                    <select id="questionCountSelect" class="bg-amber-100 border border-amber-300 rounded-lg px-2 py-0.5 font-bold text-amber-900 focus:outline-none">
                        <option value="10">10 題</option>
                        <option value="15" selected>15 題</option>
                        <option value="20">20 題</option>
                    </select>
                </div>
            </div>

            <button onclick="startGame()" class="btn-3d w-full py-3 bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white text-base md:text-xl font-black rounded-xl md:rounded-2xl border-2 border-emerald-200 shadow-lg flex items-center justify-center space-x-2">
                <i class="fas fa-play text-yellow-300 text-sm md:text-lg"></i>
                <span>進入遊樂園開始挑戰！</span>
            </button>
        </div>

        <!-- 2. 橫向遊戲畫面 (Game View) -->
        <div id="gameScreen" class="hidden w-full grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5 items-stretch my-auto">
            
            <!-- 左側：題目區 (md:col-span-6) -->
            <div class="md:col-span-6 bg-white/90 backdrop-blur-md rounded-2xl md:rounded-3xl p-3 md:p-5 shadow-xl border-2 md:border-4 border-amber-300 flex flex-col justify-between min-h-[220px] relative overflow-hidden">
                
                <div class="flex items-center justify-between border-b border-dashed border-amber-200 pb-2">
                    <div class="flex-1 mr-3">
                        <div class="flex justify-between text-xs font-bold text-amber-900 mb-1">
                            <span id="progressText">題目：1 / 10</span>
                            <span id="streakText" class="text-orange-500"><i class="fas fa-fire"></i> 連對 0</span>
                        </div>
                        <div class="w-full bg-amber-100 h-2.5 rounded-full overflow-hidden p-0.5 border border-amber-300">
                            <div id="progressBar" class="bg-gradient-to-r from-amber-400 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 10%;"></div>
                        </div>
                    </div>

                    <button onclick="speakCurrentQuestion()" class="p-1.5 bg-amber-100 hover:bg-amber-200 text-amber-800 rounded-lg transition font-bold text-xs flex items-center space-x-1" title="朗讀題目">
                        <i class="fas fa-volume-up text-amber-600"></i>
                        <span>讀題</span>
                    </button>
                </div>

                <div class="my-auto py-3 text-center relative">
                    <div id="mascotBadge" class="inline-block px-3 py-0.5 bg-yellow-200 text-amber-900 font-extrabold rounded-full text-[11px] md:text-xs mb-2 shadow-sm border border-yellow-300">
                        🎡 加油！算出正確答案吧！
                    </div>

                    <div class="flex items-center justify-center space-x-2 md:space-x-3 text-3xl sm:text-4xl md:text-5xl font-black text-gray-800 tracking-wider">
                        <span id="numA" class="text-indigo-600 bg-indigo-50 px-3 py-1 rounded-xl border border-indigo-200 shadow-inner">7</span>
                        <span class="text-pink-500">×</span>
                        <span id="numB" class="text-indigo-600 bg-indigo-50 px-3 py-1 rounded-xl border border-indigo-200 shadow-inner">8</span>
                        <span class="text-pink-500">=</span>
                        
                        <div id="answerDisplay" class="min-w-[70px] sm:min-w-[90px] h-12 sm:h-16 bg-amber-50 border-2 md:border-4 border-dashed border-amber-400 rounded-xl flex items-center justify-center text-amber-900 font-black px-2 text-3xl sm:text-4xl shadow-inner">
                            <span id="userInputText" class="text-emerald-600">?</span>
                        </div>
                    </div>

                    <!-- 提示浮層 -->
                    <div id="feedbackOverlay" class="absolute inset-0 flex items-center justify-center bg-white/95 rounded-xl opacity-0 pointer-events-none transition-opacity duration-200">
                        <div id="feedbackContent" class="text-center transform scale-90 transition-transform duration-200"></div>
                    </div>
                </div>

                <div class="bg-amber-50 rounded-xl p-2 border border-amber-200 flex items-center space-x-2">
                    <div class="text-xl">🎠</div>
                    <div class="text-[11px] text-amber-800 font-bold leading-tight">
                        <p id="tipText">按右側數字鍵盤輸入答案，再按「送出」！</p>
                    </div>
                </div>

            </div>

            <!-- 右側：九宮格數字鍵盤區 (md:col-span-6) -->
            <div class="md:col-span-6 bg-white/90 backdrop-blur-md rounded-2xl md:rounded-3xl p-3 md:p-4 shadow-xl border-2 md:border-4 border-pink-300 flex flex-col justify-center">
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="pressNum(1)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">1</button>
                    <button onclick="pressNum(2)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">2</button>
                    <button onclick="pressNum(3)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">3</button>
                    
                    <button onclick="pressNum(4)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">4</button>
                    <button onclick="pressNum(5)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">5</button>
                    <button onclick="pressNum(6)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">6</button>
                    
                    <button onclick="pressNum(7)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">7</button>
                    <button onclick="pressNum(8)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">8</button>
                    <button onclick="pressNum(9)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">9</button>
                    
                    <button onclick="pressDelete()" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-rose-100 to-rose-200 hover:from-rose-200 hover:to-rose-300 text-rose-700 text-base md:text-lg font-black rounded-xl border border-rose-300 flex items-center justify-center">
                        <i class="fas fa-backspace"></i>
                    </button>
                    <button onclick="pressNum(0)" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-sky-100 to-sky-200 hover:from-sky-200 hover:to-sky-300 text-sky-900 text-xl md:text-2xl font-black rounded-xl border border-sky-300">0</button>
                    <button onclick="submitAnswer()" class="btn-3d h-11 sm:h-13 md:h-14 bg-gradient-to-b from-emerald-400 to-emerald-500 hover:from-emerald-500 hover:to-emerald-600 text-white text-base md:text-xl font-black rounded-xl border border-emerald-300 flex items-center justify-center space-x-1">
                        <span>送出</span>
                        <i class="fas fa-check-circle text-sm md:text-base"></i>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- 3. 挑戰完成統計結算 Modal -->
    <div id="resultModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-5 md:p-7 max-w-md w-full shadow-2xl border-4 border-yellow-400 text-center animate-pop relative overflow-hidden">
            <div class="text-4xl mb-2">🏆</div>
            <h2 class="text-2xl font-black text-amber-900 mb-1">挑戰完成！太棒了！</h2>
            <p class="text-gray-500 text-xs mb-4">遊樂園頒發給你的今日數學獎牌</p>

            <div class="grid grid-cols-3 gap-2 mb-4">
                <div class="bg-amber-50 p-2.5 rounded-2xl border border-amber-200">
                    <div class="text-[10px] text-amber-600 font-bold">總題數</div>
                    <div id="resTotal" class="text-xl font-black text-amber-900">15</div>
                </div>
                <div class="bg-emerald-50 p-2.5 rounded-2xl border border-emerald-200">
                    <div class="text-[10px] text-emerald-600 font-bold">答對數</div>
                    <div id="resCorrect" class="text-xl font-black text-emerald-600">14</div>
                </div>
                <div class="bg-rose-50 p-2.5 rounded-2xl border border-rose-200">
                    <div class="text-[10px] text-rose-600 font-bold">正確率</div>
                    <div id="resRate" class="text-xl font-black text-rose-500">93%</div>
                </div>
            </div>

            <div id="resWrongContainer" class="mb-4 text-left bg-gray-50 p-3 rounded-2xl border border-gray-200 hidden">
                <div class="text-xs font-bold text-rose-600 mb-1.5 flex items-center">
                    <i class="fas fa-exclamation-circle mr-1"></i> 本次需要加強的題目：
                </div>
                <div id="resWrongList" class="flex flex-wrap gap-1.5 text-xs font-bold text-gray-700"></div>
            </div>

            <div class="flex space-x-2">
                <button onclick="closeResultModal(); startGame();" class="btn-3d flex-1 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl border-2 border-emerald-300 text-sm">
                    再挑戰一次
                </button>
                <button onclick="closeResultModal(); openDiaryModal();" class="btn-3d px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl border-2 border-amber-300 text-sm">
                    看學習日記
                </button>
            </div>
        </div>
    </div>

    <!-- 4. 學習日記 Modal -->
    <div id="diaryModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-xl w-full shadow-2xl border-4 border-amber-400 animate-pop flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center pb-2.5 border-b-2 border-amber-100 mb-3">
                <div class="flex items-center space-x-2">

                    <div>
                        <h3 class="text-lg font-black text-gray-800">乘法大師學習日記</h3>

            <div class="overflow-y-auto no-scrollbar space-y-4 flex-1 pr-1">

                    <div>
                        <div class="text-[10px] text-amber-700 font-bold">累積總挑戰</div>
                        <div id="statTotalCount" class="text-lg font-black text-amber-900">0 次</div>
                    </div>
                    <div class="border-r border-amber-200"></div>
                    <div>
                        <div class="text-[10px] text-amber-700 font-bold">平均正確率</div>
                        <div id="statAvgRate" class="text-lg font-black text-emerald-600">0%</div>
                    </div>
                    <div class="border-r border-amber-200"></div>
                    <div>
                        <div class="text-[10px] text-amber-700 font-bold">常錯魔王題數</div>
                        <div id="statMissedCount" class="text-lg font-black text-rose-500">0 題</div>

                <div class="bg-rose-50/70 p-3 rounded-2xl border border-rose-200">
                    <h4 class="text-xs font-black text-rose-800 mb-1.5 flex items-center">

                    </h4>
                    <div id="frequentWrongList" class="flex flex-wrap gap-1.5"></div>

                <div>
                    <h4 class="text-xs font-black text-gray-700 mb-2 flex items-center">
                        <i class="fas fa-history mr-1 text-amber-500"></i> 每日挑戰記錄：
                    </h4>
                    <div id="historyLogsContainer" class="space-y-1.5"></div>
                </div>
            </div>

            <div class="pt-2 mt-2 border-t border-gray-100 flex justify-between items-center text-xs">
                <button onclick="clearHistoryLogs()" class="text-rose-500 hover:text-rose-700 font-bold underline text-[11px]">
                    清除所有歷史紀錄
                </button>
                <button onclick="closeDiaryModal()" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs">
                    關閉日記
                </button>
            </div>
        </div>
    </div>

    <!-- 5. 音量設定 Modal -->
    <div id="volumeModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-5 md:p-6 max-w-sm w-full shadow-2xl border-4 border-indigo-400 animate-pop relative">
            <div class="flex justify-between items-center pb-2 border-b-2 border-indigo-100 mb-4">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 bg-indigo-500 text-white rounded-xl flex items-center justify-center font-bold">
                        <i class="fas fa-volume-up text-xs"></i>
                    </div>
                    <h3 class="text-lg font-black text-gray-800">音量調整設定</h3>
                </div>
                <button onclick="closeVolumeModal()" class="w-7 h-7 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold flex items-center justify-center text-xs">
                    ✕
                </button>
            </div>

            <div class="space-y-4 my-2">
                <!-- 背景音樂音量條 -->
                <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-black text-purple-900 flex items-center">
                            <i class="fas fa-music mr-1.5 text-purple-600"></i> 背景音樂音量
                        </label>
                        <span id="bgmVolText" class="text-xs font-black text-purple-700">25%</span>
                    </div>
                    <input type="range" id="bgmVolRange" min="0" max="1" step="0.05" value="0.25" oninput="changeBgmVolume(this.value)" class="w-full accent-purple-500 h-2 bg-purple-200 rounded-lg appearance-none cursor-pointer">
                </div>

                <!-- 讀題語音與音效音量條 -->
                <div class="bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-black text-amber-900 flex items-center">
                            <i class="fas fa-volume-up mr-1.5 text-amber-600"></i> 讀題語音與按鈕音效
                        </label>
                        <span id="sfxVolText" class="text-xs font-black text-amber-700">80%</span>
                    </div>
                    <input type="range" id="sfxVolRange" min="0" max="1" step="0.05" value="0.8" oninput="changeSfxVolume(this.value)" class="w-full accent-amber-500 h-2 bg-amber-200 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>

            <div class="mt-5 pt-2 border-t border-gray-100">
                <button onclick="closeVolumeModal()" class="btn-3d w-full py-2 bg-indigo-500 hover:bg-indigo-600 text-white font-black rounded-xl text-sm border-2 border-indigo-300">
                    確定
                </button>
            </div>
        </div>
    </div>

    <script>
        /* 遊戲核心狀態 */
        let selectedTables = [2, 3, 4, 5, 6, 7, 8, 9];
        let totalQuestionsPerRound = 15;
        let currentQuestionIndex = 0;
        let scoreCorrect = 0;
        let streakCount = 0;

        let numA = 0;
        let numB = 0;
        let currentAnswer = 0;
        let userInput = "";
        
        let roundQuestions = [];
        let roundWrongQuestions = [];

        /* Web Audio API 與 音量控制變數 */
        let bgmVolume = 0.25; // 預設背景音樂降低至 25%
        let sfxVolume = 0.8;  // 預設語音與音效為 80%

        let audioCtx = null;
        let isBgmPlaying = false;
        let bgmSynthTimer = null;
        let noteStep = 0;

        const carouselMelody = [
            { note: 523.25, dur: 0.25 }, { note: 659.25, dur: 0.25 }, { note: 783.99, dur: 0.25 }, { note: 1046.5, dur: 0.25 },
            { note: 880.00, dur: 0.25 }, { note: 659.25, dur: 0.25 }, { note: 783.99, dur: 0.5 },
            { note: 587.33, dur: 0.25 }, { note: 659.25, dur: 0.25 }, { note: 698.46, dur: 0.25 }, { note: 880.00, dur: 0.25 },
            { note: 783.99, dur: 0.5 },  { note: 523.25, dur: 0.5 }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            updateSelectedTablesUI();
            loadHistoryAndRenderDiary();

            // 初始化背景音樂預設音量
            const bgmAudio = document.getElementById('bgmAudio');
            if (bgmAudio) bgmAudio.volume = bgmVolume;

            const unlockAudio = () => {
                initAudioContext();
                if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
                document.removeEventListener('touchstart', unlockAudio);
                document.removeEventListener('pointerdown', unlockAudio);
            };
            document.addEventListener('touchstart', unlockAudio, { once: true });
            document.addEventListener('pointerdown', unlockAudio, { once: true });
        });

        function openVolumeModal() {
            document.getElementById('volumeModal').classList.remove('hidden');
        }

        function closeVolumeModal() {
            document.getElementById('volumeModal').classList.add('hidden');
        }

        function changeBgmVolume(val) {
            bgmVolume = parseFloat(val);
            document.getElementById('bgmVolText').innerText = Math.round(bgmVolume * 100) + '%';
            const bgmAudio = document.getElementById('bgmAudio');
            if (bgmAudio) {
                bgmAudio.volume = bgmVolume;
            }
        }

        function changeSfxVolume(val) {
            sfxVolume = parseFloat(val);
            document.getElementById('sfxVolText').innerText = Math.round(sfxVolume * 100) + '%';
        }

        /* 補上更新選擇段數 UI 與 selectedTables 陣列之函式 */
        function updateSelectedTablesUI() {
            const checkboxes = document.querySelectorAll('.table-checkbox');
            selectedTables = [];
            checkboxes.forEach(cb => {
                const label = cb.closest('label');
                const checkIcon = label ? label.querySelector('.check-icon') : null;
                if (cb.checked) {
                    selectedTables.push(parseInt(cb.value));
                    if (label) {
                        label.classList.add('border-amber-200', 'bg-amber-50');
                        label.classList.remove('border-gray-300', 'bg-gray-100', 'opacity-40');
                    }
                    if (checkIcon) {
                        checkIcon.classList.remove('opacity-0');
                        checkIcon.classList.add('opacity-100');
                    }
                } else {
                    if (label) {
                        label.classList.remove('border-amber-200', 'bg-amber-50');
                        label.classList.add('border-gray-300', 'bg-gray-100', 'opacity-40');
                    }
                    if (checkIcon) {
                        checkIcon.classList.remove('opacity-100');
                        checkIcon.classList.add('opacity-0');
                    }
                }
            });
        }

        function selectAllTables(selectAll) {
            const checkboxes = document.querySelectorAll('.table-checkbox');
            checkboxes.forEach(cb => cb.checked = selectAll);
            updateSelectedTablesUI();
        }

        function showSetupScreen() {
            document.getElementById('setupScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
        }

        function startGame() {
            if (selectedTables.length === 0) {
                alertModal("請至少選擇一個乘法表段數喔！");
                return;
            }

            totalQuestionsPerRound = parseInt(document.getElementById('questionCountSelect').value) || 15;
            currentQuestionIndex = 0;
            scoreCorrect = 0;
            streakCount = 0;
            roundWrongQuestions = [];

            roundQuestions = [];
            for (let i = 0; i < totalQuestionsPerRound; i++) {
                const randA = selectedTables[Math.floor(Math.random() * selectedTables.length)];
                const randB = Math.floor(Math.random() * 9) + 1;
                roundQuestions.push({ a: randA, b: randB });
            }

            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuestionIndex >= totalQuestionsPerRound) {
                finishGameRound();
                return;
            }

            const q = roundQuestions[currentQuestionIndex];
            numA = q.a;
            numB = q.b;
            currentAnswer = numA * numB;
            userInput = "";

            document.getElementById('numA').innerText = numA;
            document.getElementById('numB').innerText = numB;
            document.getElementById('userInputText').innerText = "?";
            document.getElementById('userInputText').className = "text-amber-400";
            
            document.getElementById('progressText').innerText = `題目：${currentQuestionIndex + 1} / ${totalQuestionsPerRound}`;
            document.getElementById('streakText').innerHTML = `<i class="fas fa-fire"></i> 連對 ${streakCount}`;
            const pct = ((currentQuestionIndex) / totalQuestionsPerRound) * 100;
            document.getElementById('progressBar').style.width = `${pct}%`;

            speakCurrentQuestion();
        }

        /* 語音發音 (修正為「承以」ㄔㄥˊ ㄧˇ) */
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                utterance.volume = sfxVolume; // 讀題語音音量
                window.speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            speakText(`${numA} 承以 ${numB} 等於多少？`);
        }

        function pressNum(num) {
            if (userInput.length >= 3) return;
            userInput += num.toString();
            document.getElementById('userInputText').innerText = userInput;
            document.getElementById('userInputText').className = "text-emerald-600 font-extrabold";

            speakText(num.toString());
            playBeepSound(400 + num * 30, 'sine', 0.08);
        }

        function pressDelete() {
            if (userInput.length > 0) {
                userInput = userInput.slice(0, -1);
                document.getElementById('userInputText').innerText = userInput.length > 0 ? userInput : "?";
                if (userInput.length === 0) {
                    document.getElementById('userInputText').className = "text-amber-400";
                }
                playBeepSound(300, 'square', 0.05);
            }
        }

        function submitAnswer() {
            if (userInput === "") return;

            const userVal = parseInt(userInput);
            const isCorrect = (userVal === currentAnswer);

            showFeedbackOverlay(isCorrect);

            if (isCorrect) {
                scoreCorrect++;
                streakCount++;
                playCorrectSound();
                speakText("答對了！太棒了！");
            } else {
                streakCount = 0;
                roundWrongQuestions.push({ a: numA, b: numB, wrongInput: userVal, answer: currentAnswer });
                playWrongSound();
                speakText(`答錯囉，答案是 ${currentAnswer}`);
            }

            setTimeout(() => {
                hideFeedbackOverlay();
                currentQuestionIndex++;
                loadNextQuestion();
            }, 1300);
        }

        function showFeedbackOverlay(isCorrect) {
            const overlay = document.getElementById('feedbackOverlay');
            const content = document.getElementById('feedbackContent');

            if (isCorrect) {
                content.innerHTML = `
                    <div class="text-5xl mb-1 animate-bounce">🌟</div>
                    <div class="text-xl font-black text-emerald-600">答對了！好厲害！</div>
                `;
            } else {
                content.innerHTML = `
                    <div class="text-5xl mb-1">😅</div>
                    <div class="text-xl font-black text-rose-500">差一點點！</div>
                    <div class="text-xs font-bold text-gray-600 mt-0.5">${numA} × ${numB} = <span class="text-emerald-600 font-extrabold text-base">${currentAnswer}</span></div>
                `;
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
        }

        function hideFeedbackOverlay() {
            const overlay = document.getElementById('feedbackOverlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
        }

        function finishGameRound() {
            const errorRate = Math.round(((totalQuestionsPerRound - scoreCorrect) / totalQuestionsPerRound) * 100);
            const accuracyRate = 100 - errorRate;

            document.getElementById('resTotal').innerText = totalQuestionsPerRound;
            document.getElementById('resCorrect').innerText = scoreCorrect;
            document.getElementById('resRate').innerText = `${accuracyRate}%`;

            const wrongContainer = document.getElementById('resWrongContainer');
            const wrongList = document.getElementById('resWrongList');
            wrongList.innerHTML = "";

            if (roundWrongQuestions.length > 0) {
                wrongContainer.classList.remove('hidden');
                roundWrongQuestions.forEach(item => {
                    const tag = document.createElement('span');
                    tag.className = "px-2 py-0.5 bg-rose-100 text-rose-700 rounded-lg border border-rose-300";
                    tag.innerText = `${item.a} × ${item.b} = ${item.answer}`;
                    wrongList.appendChild(tag);
                });
            } else {
                wrongContainer.classList.add('hidden');
            }

            document.getElementById('resultModal').classList.remove('hidden');

            saveRoundToStorage({
                date: new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                tablesStr: selectedTables.join(', ') + ' 段',
                total: totalQuestionsPerRound,
                correct: scoreCorrect,
                errorRate: errorRate,
                accuracyRate: accuracyRate,
                wrongItems: roundWrongQuestions.map(w => `${w.a}×${w.b}`)
            });
        }

        function closeResultModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        /* 本地 LocalStorage 學習日記處理 */
        const STORAGE_KEY = 'kids_99_park_logs_v1';

        function getStoredLogs() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveRoundToStorage(logEntry) {
            let logs = getStoredLogs();
            logs.unshift(logEntry);
            if (logs.length > 50) logs = logs.slice(0, 50);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
        }

        function openDiaryModal() {
            loadHistoryAndRenderDiary();
            document.getElementById('diaryModal').classList.remove('hidden');
        }

        function closeDiaryModal() {
            document.getElementById('diaryModal').classList.add('hidden');
        }

        function loadHistoryAndRenderDiary() {
            const logs = getStoredLogs();
            const totalRounds = logs.length;
            let sumAccuracy = 0;
            const wrongFrequencyMap = {};

            logs.forEach(log => {
                sumAccuracy += log.accuracyRate;
                if (log.wrongItems && Array.isArray(log.wrongItems)) {
                    log.wrongItems.forEach(item => {
                        wrongFrequencyMap[item] = (wrongFrequencyMap[item] || 0) + 1;
                    });
                }
            });

            const avgRate = totalRounds > 0 ? Math.round(sumAccuracy / totalRounds) : 0;

            document.getElementById('statTotalCount').innerText = `${totalRounds} 次`;
            document.getElementById('statAvgRate').innerText = `${avgRate}%`;
            
            const sortedWrong = Object.keys(wrongFrequencyMap).sort((a,b) => wrongFrequencyMap[b] - wrongFrequencyMap[a]);
            document.getElementById('statMissedCount').innerText = `${sortedWrong.length} 題`;

            const freqWrongContainer = document.getElementById('frequentWrongList');
            freqWrongContainer.innerHTML = "";
            if (sortedWrong.length === 0) {
                freqWrongContainer.innerHTML = `<span class="text-xs text-gray-400 font-bold">目前沒有常錯題目，表現太精彩了！👏</span>`;
            } else {
                sortedWrong.slice(0, 8).forEach(item => {
                    const count = wrongFrequencyMap[item];
                    const tag = document.createElement('span');
                    tag.className = "px-2.5 py-0.5 bg-rose-500 text-white rounded-full font-bold text-xs shadow-sm flex items-center space-x-1";
                    tag.innerHTML = `<span>${item}</span><span class="bg-rose-700 px-1 py-0.2 rounded-full text-[9px]">錯 ${count} 次</span>`;
                    freqWrongContainer.appendChild(tag);
                });
            }

            const logsContainer = document.getElementById('historyLogsContainer');
            logsContainer.innerHTML = "";
            if (logs.length === 0) {
                logsContainer.innerHTML = `<div class="text-center py-5 text-gray-400 text-xs font-bold">尚無挑戰紀錄，快去挑戰吧！</div>`;
            } else {
                logs.forEach(log => {
                    const card = document.createElement('div');
                    card.className = "p-2.5 bg-gray-50 hover:bg-amber-50/50 rounded-xl border border-gray-200 transition flex items-center justify-between text-xs";
                    card.innerHTML = `
                        <div>
                            <div class="font-extrabold text-gray-800">${log.date} <span class="ml-1 text-amber-700 font-bold bg-amber-100 px-1.5 py-0.5 rounded">${log.tablesStr}</span></div>
                            <div class="text-gray-500 text-[11px] mt-0.5">答對 ${log.correct} / ${log.total} 題 · 錯誤率：<span class="text-rose-500 font-bold">${log.errorRate}%</span></div>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-black ${log.accuracyRate >= 80 ? 'text-emerald-600' : 'text-amber-600'}">${log.accuracyRate}% 正確</span>
                        </div>
                    `;
                    logsContainer.appendChild(card);
                });
            }
        }

        function clearHistoryLogs() {
            localStorage.removeItem(STORAGE_KEY);
            loadHistoryAndRenderDiary();
        }

        /* 背景音樂 (自動優先播放 bgm.mp3；無檔時切換為合成音) */
        function initAudioContext() {
            if (!audioCtx) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtxClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeepSound(freq, type, duration) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15 * sfxVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function playCorrectSound() {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                osc.frequency.setValueAtTime(1046.50, now + 0.24);

                gain.gain.setValueAtTime(0.2 * sfxVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } catch(e) {}
        }

        function playWrongSound() {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);

                gain.gain.setValueAtTime(0.15 * sfxVolume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.35);
            } catch(e) {}
        }

        function toggleBGM() {
            initAudioContext();
            isBgmPlaying = !isBgmPlaying;
            
            const bgmBtn = document.getElementById('bgmToggleBtn');
            const bgmIcon = document.getElementById('bgmIcon');
            const bgmText = document.getElementById('bgmText');
            const bgmAudio = document.getElementById('bgmAudio');

            if (isBgmPlaying) {
                bgmBtn.classList.replace('bg-purple-500', 'bg-emerald-500');
                bgmBtn.classList.replace('hover:bg-purple-600', 'hover:bg-emerald-600');
                bgmIcon.className = "fas fa-volume-up animate-pulse";
                bgmText.innerText = "音樂: 開";

                bgmAudio.volume = bgmVolume; // 設定目前滑桿指定之音量

                // 嘗試播放本地 bgm.mp3 檔案
                bgmAudio.play().then(() => {
                    // MP3 播放成功
                }).catch(() => {
                    // 若無 bgm.mp3 檔案或載入失敗，啟動內建合成樂園背景音樂
                    playBGMStep();
                });
            } else {
                bgmBtn.classList.replace('bg-emerald-500', 'bg-purple-500');
                bgmBtn.classList.replace('hover:bg-emerald-600', 'hover:bg-purple-600');
                bgmIcon.className = "fas fa-music";
                bgmText.innerText = "音樂: 關";
                bgmAudio.pause();
                if (bgmSynthTimer) clearTimeout(bgmSynthTimer);
            }
        }

        function playBGMStep() {
            if (!isBgmPlaying) return;

            const item = carouselMelody[noteStep];
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(item.note, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.04 * bgmVolume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + item.dur);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + item.dur);
            } catch(e) {}

            noteStep = (noteStep + 1) % carouselMelody.length;
            bgmSynthTimer = setTimeout(playBGMStep, item.dur * 1000);
        }

        function alertModal(msg) {
            const petMsg = document.getElementById('tipText');
            if (petMsg) petMsg.innerText = msg;
        }
    </script>
</body>
</html>
